<!doctype html>
<meta charset="utf-8" />
<title>grocy-food-card demo</title>
<style>body{margin:0;background:#141821;padding:24px;display:flex;gap:24px;flex-wrap:wrap}
  .pane{background:#1b2130;border-radius:12px;min-width:320px}</style>
<script type="importmap">
{ "imports": {
  "lit": "https://cdn.jsdelivr.net/npm/lit@3.3.3/+esm"
} }
</script>
<script type="module">
  import "../dist/mealplan-card.js";
  import "../dist/shopping-card.js";
  import "../dist/recipe-card.js";

  const meals = { states: { "sensor.grocy_meal_plan": { attributes: { meals: [
    { id: 1, day: "Wed", type: "recipe", recipe: { name: "Tacos" } },
    { id: 2, day: "Thu", type: "note", note: "Leftovers night" },
    { id: 3, day: "Thu", type: "section", section: { name: "Dinner" } }
  ] } } } };

  const shop = { states: { "sensor.grocy_shopping_list": { attributes: { products: [
    { id: 11, amount: 2.0, note: "", product: { name: "Eggs" } },
    { id: 12, amount: 1.5, note: "organic", product: { name: "Milk" } },
    { id: 13, amount: 1.0, note: "" }
  ] } } }, callService: (d, s, data) => console.log("callService", d, s, data) };

  const mp = document.createElement("grocy-mealplan-card");
  mp.setConfig({}); mp.hass = meals;
  const mpPane = document.createElement("div"); mpPane.className = "pane"; mpPane.appendChild(mp);

  const sc = document.createElement("grocy-shopping-card");
  sc.setConfig({ shopping_list_id: "1" }); sc.hass = shop;   // check-off visible
  const scPane = document.createElement("div"); scPane.className = "pane"; scPane.appendChild(sc);

  // picture_file_name is null on BOTH recipes on purpose: the demo has no HA to
  // serve /api/files/..., so a real filename would render a broken image. The
  // placeholder-tile path is what gets exercised offline.
  const RECIPES = [
    { id: 1, name: "Tacos", description: "<ol><li>Brown the beef</li><li>Warm tortillas</li></ol>",
      picture_file_name: null, base_servings: 4, desired_servings: 6 },
    { id: 2, name: "Pancakes", description: "<p>Mix.</p><p>Fry.</p>",
      picture_file_name: null, base_servings: 2, desired_servings: 2 }
  ];

  // Resolved-shape rows: product_name joined, recipe_amount ALREADY SCALED
  // server-side, and NO unit name (qu_id is a bare int) — spec §4.2. Tacos'
  // amounts are the 4->6 scaled values Grocy itself returns (1.5 -> 2.25,
  // 12 -> 18), NOT the base amounts: the card must not scale them again.
  const RESOLVED = [
    { id: 10, recipe_id: 1, product_name: "Ground beef", recipe_amount: 2.25, qu_id: 4 },
    { id: 11, recipe_id: 1, product_name: "Tortillas",   recipe_amount: 18,   qu_id: 2 },
    { id: 12, recipe_id: 1, product_name: "Salt",        recipe_amount: "a pinch", qu_id: 5 },
    { id: 13, recipe_id: 2, product_name: "Flour",       recipe_amount: 2,    qu_id: 6 },
    { id: 14, recipe_id: 2, product_name: "Butter",      recipe_amount: 0.49950000000000006, qu_id: 4 }
  ];
  const UNITS = [
    { id: 2, name: "Piece" }, { id: 4, name: "Pound" },
    { id: 5, name: "Tablespoon" }, { id: 6, name: "Cup" }
  ];

  // Answers the two rest_commands the card calls. The 120ms delay is deliberate:
  // it makes the DETAIL loading state visible instead of flashing past.
  const fakeCallService = (domain, service, data, target, notify, returnResponse) => {
    console.log("callService", domain, service, data);
    const content =
      service === "grocy_recipe_ingredients"
        ? RESOLVED.filter((r) => r.recipe_id === data.recipe_id)
        : service === "grocy_quantity_units" ? UNITS : [];
    return new Promise((resolve) =>
      setTimeout(() => resolve({ response: { content } }), 120));
  };

  const recipes = {
    states: { "sensor.grocy_recipes": { attributes: { recipes: RECIPES } } },
    callService: fakeCallService,
  };

  const rc = document.createElement("grocy-recipe-card");
  rc.setConfig({}); rc.hass = recipes;
  const rcPane = document.createElement("div"); rcPane.className = "pane"; rcPane.appendChild(rc);

  document.body.append(mpPane, scPane, rcPane);
</script>
