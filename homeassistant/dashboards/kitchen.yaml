# Layout D — "Today & This Week" (2026-09-01 layout pass, iteration 3).
#
# Home is a GLANCE screen: this week's agenda, then each kid's chores as big
# tappable tiles. Three columns:
#   1  This Week (full column height)
#   2  Rowan  -> tiles, points, Perspective at the bottom
#   3  Wystan -> tiles, points, Weather at the bottom
#
# Perspective and Weather sit last in their columns so the columns bottom out
# together instead of leaving dead space.
title: Kitchen
views:
  - title: Home
    path: home
    icon: mdi:home-heart
    type: sections
    max_columns: 3
    sections:
      # ---- Column 1: this week ---------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: This Week
            heading_style: title
            icon: mdi:calendar-month
            # Tapping the heading opens the full calendar; replaces the old
            # full-width button, which ate a whole block.
            tap_action:
              action: navigate
              navigation_path: /kitchen-snapshot/schedule
          - type: calendar
            # dayGridWeek, NOT listWeek: FullCalendar's list plugin only renders
            # days that HAVE events (ha-full-calendar.ts:65 -> type "list"), so
            # empty days silently vanished. dayGridWeek shows all 7 day cells,
            # so a day with nothing on it reads as genuinely empty.
            initial_view: dayGridWeek
            grid_options:
              rows: 12
            entities:
              - calendar.family
              - calendar.deharts
              - calendar.garrett_dehart
              - calendar.rebdinatl_gmail_com
              - calendar.birthdays
              - calendar.holidays_in_united_states
          # Renders nothing unless idle (packages/screensaver.yaml).
          - type: custom:screensaver-card
            media_path: photos
            photo_duration: 10
            shuffle: true

      # ---- Column 2: Rowan --------------------------------------------------
      - type: grid
        cards:
          - type: markdown
            text_only: true
            content: >-
              <h1 style="margin:0;padding:2px 0 8px;font-size:36px;line-height:1.05;
              font-weight:800;letter-spacing:0.5px;color:#4fc3f7;
              text-shadow:0 0 20px #4fc3f755;">Rowan</h1>
          - type: custom:button-card
            name: Chores Due
            show_icon: false
            show_state: false
            tap_action:
              action: none
            styles:
              card:
                - height: 32px
                - background: "#4fc3f722"
                - border: none
                - border-left: "4px solid #4fc3f7"
                - border-radius: 8px
                - box-shadow: none
              name:
                - justify-self: start
                - padding-left: 10px
                - font-size: 13px
                - font-weight: 700
                - letter-spacing: 1px
                - text-transform: uppercase
                - color: "#4fc3f7"
          - type: custom:auto-entities
            card:
              type: grid
              columns: 4
              square: false
            card_param: cards
            filter:
              include:
                - entity_id: sensor.rowan_choreops_chore_status_*
                  state: /^(pending|due|overdue|claimed)$/
                  options:
                    type: custom:button-card
                    show_state: true
                    size: 42px
                    # Strip the "Rowan (ChoreOps) Chore Status - " prefix; the
                    # column header already names the kid.
                    name: >
                      [[[ return entity.attributes.friendly_name
                            .replace(/^.*Chore Status\s*[-–]\s*/, ''); ]]]
                    styles:
                      card: [height: 104px, border-radius: 12px]
                      name: [font-size: 11px, white-space: normal, padding-top: 3px, line-height: 1.15]
                      state: [font-size: 9px, text-transform: uppercase, opacity: 0.7]
                    state:
                      - value: overdue
                        styles:
                          card: [border: 2px solid var(--error-color)]
                          icon: [color: var(--error-color)]
                      - value: claimed
                        styles:
                          card: [border: 2px solid var(--warning-color)]
                          icon: [color: var(--warning-color)]
                      - operator: default
                        styles:
                          card: [border: 2px solid var(--primary-color)]
                    tap_action:
                      action: more-info
              exclude:
                - state: not_my_turn
                - state: unavailable
                - state: unknown
            sort:
              method: state
          - type: custom:button-card
            name: Completed
            show_icon: false
            show_state: false
            tap_action:
              action: none
            styles:
              card:
                - height: 32px
                - background: "#4fc3f722"
                - border: none
                - border-left: "4px solid #4fc3f7"
                - border-radius: 8px
                - box-shadow: none
              name:
                - justify-self: start
                - padding-left: 10px
                - font-size: 13px
                - font-weight: 700
                - letter-spacing: 1px
                - text-transform: uppercase
                - color: "#4fc3f7"
          - type: custom:auto-entities
            card:
              type: grid
              columns: 4
              square: false
            card_param: cards
            filter:
              include:
                - entity_id: sensor.rowan_choreops_chore_status_*
                  state: /^(completed|approved)$/
                  options:
                    type: custom:button-card
                    show_state: true
                    size: 32px
                    # Strip the "Rowan (ChoreOps) Chore Status - " prefix; the
                    # column header already names the kid.
                    name: >
                      [[[ return entity.attributes.friendly_name
                            .replace(/^.*Chore Status\s*[-–]\s*/, ''); ]]]
                    styles:
                      card: [height: 84px, border-radius: 12px, opacity: 0.5]
                      name: [font-size: 11px, white-space: normal, padding-top: 3px, line-height: 1.15]
                      state: [font-size: 9px, text-transform: uppercase, opacity: 0.7]
                    state:
                      - operator: default
                        styles:
                          icon: [color: var(--success-color)]
                    tap_action:
                      action: more-info
              exclude:
                - state: not_my_turn
                - state: unavailable
                - state: unknown
            sort:
              method: state
          - type: custom:button-card
            name: Scoreboard
            show_icon: false
            show_state: false
            tap_action:
              action: none
            styles:
              card:
                - height: 32px
                - background: "#4fc3f722"
                - border: none
                - border-left: "4px solid #4fc3f7"
                - border-radius: 8px
                - box-shadow: none
              name:
                - justify-self: start
                - padding-left: 10px
                - font-size: 13px
                - font-weight: 700
                - letter-spacing: 1px
                - text-transform: uppercase
                - color: "#4fc3f7"
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:button-card
                entity: sensor.rowan_choreops_points
                name: Total Earned
                show_icon: false
                show_state: false
                show_label: true
                label: >
                  [[[ var v = entity.attributes['point_stat_points_earned_all_time'];
                      if (v === undefined || v === null || v === 'unknown' || v === 'unavailable') v = 0;
                      return '' + Math.round(Number(v)); ]]]
                tap_action:
                  action: none
                styles:
                  card: [height: 66px, background: '#ffffff0d', border: none, box-shadow: none, border-radius: 10px]
                  name: [font-size: 10px, opacity: 0.65, text-transform: uppercase, letter-spacing: 0.5px]
                  label: [font-size: 22px, font-weight: 800, color: '#4fc3f7', padding-top: 2px]
              - type: custom:button-card
                entity: sensor.rowan_choreops_chores
                name: Completed
                show_icon: false
                show_state: false
                show_label: true
                label: >
                  [[[ var v = entity.state;
                      if (v === undefined || v === null || v === 'unknown' || v === 'unavailable') v = 0;
                      return '' + Math.round(Number(v)); ]]]
                tap_action:
                  action: none
                styles:
                  card: [height: 66px, background: '#ffffff0d', border: none, box-shadow: none, border-radius: 10px]
                  name: [font-size: 10px, opacity: 0.65, text-transform: uppercase, letter-spacing: 0.5px]
                  label: [font-size: 22px, font-weight: 800, color: '#4fc3f7', padding-top: 2px]
              - type: custom:button-card
                entity: sensor.rowan_choreops_points
                name: Multiplier
                show_icon: false
                show_state: false
                show_label: true
                label: >
                  [[[ var v = entity.attributes['points_multiplier'];
                      if (v === undefined || v === null || v === 'unknown' || v === 'unavailable') v = 1;
                      return 'x' + Math.round(Number(v)); ]]]
                tap_action:
                  action: none
                styles:
                  card: [height: 66px, background: '#ffffff0d', border: none, box-shadow: none, border-radius: 10px]
                  name: [font-size: 10px, opacity: 0.65, text-transform: uppercase, letter-spacing: 0.5px]
                  label: [font-size: 22px, font-weight: 800, color: '#4fc3f7', padding-top: 2px]
          - type: custom:button-card
            entity: sensor.rowan_choreops_achievement_progress_7_day_streak
            name: 7-Day Streak
            show_icon: true
            show_state: false
            show_label: true
            size: 18px
            # raw_progress / target_value give the ChoreOps "6/250" reading;
            # the sensor STATE is a 0-100 percent, which drives the bar width.
            label: >
              [[[ var r = entity.attributes.raw_progress;
                  var t = entity.attributes.target_value;
                  if (r === undefined || t === undefined) return '';
                  return r + '/' + t; ]]]
            custom_fields:
              bar: >
                [[[ var pct = Number(entity.state);
                    if (isNaN(pct)) pct = 0;
                    return `<div style="width:100%;height:6px;border-radius:3px;
                      background:rgba(255,255,255,0.13);overflow:hidden;">
                      <div style="width:${pct}%;height:100%;border-radius:3px;
                      background:#4fc3f7;"></div></div>`; ]]]
            tap_action:
              action: none
            styles:
              card:
                - height: 46px
                - background: "#ffffff08"
                - border: none
                - box-shadow: none
                - border-radius: 8px
                - padding: 4px 10px
              grid:
                - grid-template-areas: '"i n l" "i bar bar"'
                - grid-template-columns: 26px 1fr auto
                - grid-template-rows: auto auto
                - gap: 2px 6px
              name:
                - justify-self: start
                - font-size: 12px
                - opacity: 0.9
              label:
                - justify-self: end
                - font-size: 11px
                - font-weight: 700
                - color: "#4fc3f7"
              icon:
                - color: "#4fc3f7"
                - opacity: 0.9
              custom_fields:
                bar:
                  - justify-self: stretch
                  - align-self: center
