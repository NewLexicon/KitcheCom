# Layout B — Tile Grid (spec §1 Decision 6). Standard HA cards only.
# Entity ids are PLACEHOLDERS — wire to real entities on hardware setup.
title: Kitchen
views:
  - title: Home
    type: sections
    sections:
      # Hero column — clock/weather/voice anchor (Layout B left hero)
      - type: grid
        cards:
          - type: clock            # native HA clock card
          - type: weather-forecast
            entity: weather.forecast_home   # Met.no (built-in, no API key) — wired 2026-06-15
          - type: button
            name: Hold to talk
            icon: mdi:microphone
            tap_action:
              action: assist        # opens HA Assist (voice) — native
          - type: custom:screensaver-card
            # media_path is a folder UNDER the media_source root, which
            # configuration.yaml maps as media_dirs.local -> /config/media.
            # So this resolves to /config/media/photos. Renamed from the
            # confusing nested "media/media" on 2026-08-17.
            media_path: photos
            photo_duration: 10
            # 2026-08-18: without shuffle the order is strictly alphabetical, and
            # the first 41 photos are all landscape -- so the first portrait pair
            # did not appear until ~6m50s in, and every kiosk restart reset the
            # cursor to 0. Shuffling distributes the 34 portraits throughout.
            shuffle: true
            # idle_entity defaults to input_boolean.kitchen_idle
      # Groceries
      - type: grid
        cards:
          - type: todo-list
            title: Groceries
            entity: todo.groceries  # local_todo (wired 2026-06-15, spec M-2)
      # Calendar + chores
      - type: grid
        cards:
          - type: calendar
            entities:
              # CONFIRMED 2026-08-14 (dev rig): the Google Calendar integration
              # names a secondary calendar titled "Family" exactly calendar.family,
              # so the old placeholder resolved on its own. Read AND write verified
              # (calendar.create_event succeeded against the live calendar).
              - calendar.family
          # Supersedes the todo.chores local_todo card (wired 2026-06-15).
          # ChoreOps owns chores now; its generated dashboard lives at /cod-chores
          # (Task 8). The orphaned todo.chores entity is deleted in Task 10.
          - type: button
            name: Chores
            icon: mdi:broom
            tap_action:
              action: navigate
              navigation_path: /cod-chores
            show_state: false
          # Perspective (spec: 2026-08-18-daily-quotes-design.md). A titled, movable
          # card by design — it is meant to be dragged between columns and
          # dashboards during a later layout pass, so it stays self-contained.
          #
          # Titled "Perspective", not "Daily Quote": the quote rotates hourly.
          #
          # Reads ATTRIBUTES, not the state: HA truncates state at 255 chars, and
          # the author only exists as an attribute.
          #
          # The {% if a %} guard is load-bearing — 349 of the 5,421 local quotes
          # have no author, and without it the card renders a dangling em dash.
          # Pre-verified by rendering this template inside the HA container against
          # all four real cases (2026-08-18).
          - type: markdown
            title: Perspective
            content: >-
              {% set q = state_attr('sensor.daily_quote', 'text') %}
              {% set a = state_attr('sensor.daily_quote', 'author') %}
              {% if q %}
              *"{{ q }}"*{% if a %}

              — **{{ a }}**{% endif %}
              {% else %}
              *Take a deep breath and start the day fresh.*
              {% endif %}
# Screensaver: the custom card (custom:screensaver-card) is now instantiated in
# the hero grid section above. It renders nothing unless idle, driven by the
# kitchen_idle automation (packages/screensaver.yaml, Task 4). Its JS resource
# (/local/screensaver-card.js, registered as a dashboard resource in HA) remains
# a hardware-phase INSTALL.md step — see deploy/INSTALL.md.
