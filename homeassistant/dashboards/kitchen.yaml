                - padding: 4px 10px
              grid:
                - grid-template-areas: '"i n l" "i bar bar"'
                - grid-template-columns: 26px 1fr auto
                - grid-template-rows: auto auto
                - gap: 2px 6px
              name:
                - justify-self: start
                - font-size: 12px
                - opacity: 0.9
              label:
                - justify-self: end
                - font-size: 11px
                - font-weight: 700
                - color: "#4fc3f7"
              icon:
                - color: "#4fc3f7"
                - opacity: 0.9
              custom_fields:
                bar:
                  - justify-self: stretch
                  - align-self: center
                  - padding-right: 2px
          - type: custom:button-card
            entity: sensor.rowan_choreops_achievement_progress_early_riser
            name: Early Riser
            show_icon: true
            show_state: false
            show_label: true
            size: 18px
            # raw_progress / target_value give the ChoreOps "6/250" reading;
            # the sensor STATE is a 0-100 percent, which drives the bar width.
            label: >
              [[[ var r = entity.attributes.raw_progress;
                  var t = entity.attributes.target_value;
                  if (r === undefined || t === undefined) return '';
                  return r + '/' + t; ]]]
            custom_fields:
              bar: >
                [[[ var pct = Number(entity.state);
                    if (isNaN(pct)) pct = 0;
                    return `<div style="width:100%;height:6px;border-radius:3px;
                      background:rgba(255,255,255,0.13);overflow:hidden;">
                      <div style="width:${pct}%;height:100%;border-radius:3px;
                      background:#4fc3f7;"></div></div>`; ]]]
            tap_action:
              action: none
            styles:
              card:
                - height: 46px
                - background: "#ffffff08"
                - border: none
                - box-shadow: none
                - border-radius: 8px
                - padding: 4px 10px
              grid:
                - grid-template-areas: '"i n l" "i bar bar"'
                - grid-template-columns: 26px 1fr auto
                - grid-template-rows: auto auto
                - gap: 2px 6px
              name:
                - justify-self: start
                - font-size: 12px
                - opacity: 0.9
              label:
                - justify-self: end
                - font-size: 11px
                - font-weight: 700
                - color: "#4fc3f7"
              icon:
                - color: "#4fc3f7"
                - opacity: 0.9
              custom_fields:
                bar:
                  - justify-self: stretch
                  - align-self: center
                  - padding-right: 2px
          - type: markdown
            title: Perspective
            # Reads ATTRIBUTES (state truncates at 255 chars). The {% if a %}
            # guard is load-bearing: 349 of 5,421 local quotes have no author.
            grid_options:
              rows: 4
            content: >-
              {% set q = state_attr('sensor.daily_quote', 'text') %}
              {% set a = state_attr('sensor.daily_quote', 'author') %}
              {% if q %}
              *"{{ q }}"*{% if a %}

              — **{{ a }}**{% endif %}
              {% else %}
              *Take a deep breath and start the day fresh.*
              {% endif %}

