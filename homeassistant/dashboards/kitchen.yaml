  # ==========================================================================
  # SCHEDULE — the full calendar
  # ==========================================================================
  - title: Schedule
    path: schedule
    icon: mdi:calendar-month
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: calendar
            # timeGridWeek = the Google-style hour grid. Each CALENDAR gets its
            # own colour (hui-calendar-card.ts:146 reads the entity registry's
            # calendar.color, else auto-assigns by index). Per-EVENT Google
            # colours are not exposed over the API, so they can't be mirrored.
            initial_view: timeGridWeek
            grid_options:
              rows: 14
            entities:
              - calendar.family
              - calendar.deharts
              - calendar.garrett_dehart
              - calendar.rebdinatl_gmail_com
              - calendar.birthdays
              - calendar.holidays_in_united_states

  # ==========================================================================
  # LISTS — groceries + todo, room to grow
  # ==========================================================================
  - title: Lists
    path: lists
    icon: mdi:format-list-checks
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: todo-list
            title: Groceries
            entity: todo.groceries
      - type: grid
        cards:
          - type: todo-list
            title: Shopping List
            entity: todo.shopping_list
