# Screensaver idle state (spec §5 reactive-card model).
# The custom screensaver card subscribes to input_boolean.kitchen_idle and fades
# in/out IN PLACE (no view switching — HA core has no native remote view-switch).

input_boolean:
  kitchen_idle:
    name: Kitchen Idle
    icon: mdi:television-ambient-light

  # SAFETY SWITCH (added 2026-08-12). The screensaver has exactly ONE way out:
  # input_button.kitchen_activity, which only the kiosk's TOUCH handler presses.
  # With no touch hardware wired, turning idle on was a ONE-WAY DOOR — the panel
  # went black and could not be recovered from the kitchen at all (a mouse does
  # not help; the wake path is an HA button, not an OS input event). It also
  # restored as "on" across reboots, so the screen came back black every time.
  #
  # While this is OFF, the inactivity timer can never blank the screen. Turn it
  # ON once a wake path actually works (touch wired, or the motion rule below).
  kitchen_screensaver_enabled:
    name: Kitchen Screensaver Enabled
    icon: mdi:television-play

input_number:
  # Screensaver delay, editable from the panel's settings drawer (2026-10-21).
  # No `initial:` so the value survives restarts. ⚠ An input_number with no
  # restored state starts at `min` — set it to 30 once right after first deploy
  # (plan Task 12), or the screensaver drops to 5 minutes.
  kitchen_screensaver_minutes:
    name: Screensaver delay
    min: 5
    max: 120
    step: 5
    unit_of_measurement: min
    mode: slider
    icon: mdi:timer-sand

timer:
  kitchen_inactivity:
    # Fallback only. Every timer.start below passes a duration from
    # input_number.kitchen_screensaver_minutes; this value applies only if one doesn't.
    duration: "00:30:00"   # 2026-09-01: 30 min — the panel stays up through breakfast

automation:
  - alias: "Kitchen — go idle when inactivity timer finishes"
    trigger:
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.kitchen_inactivity
    # Refuse to blank the screen unless the safety switch is on. Without this the
    # panel can strand itself with no way back (see kitchen_screensaver_enabled).
    condition:
      - condition: state
        entity_id: input_boolean.kitchen_screensaver_enabled
        state: "on"
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.kitchen_idle

  # Restart the countdown whenever the screensaver is switched ON (2026-08-13).
  # WHY: a timer only emits timer.finished while it is actively counting. On
  # startup the timer runs once; if it finishes while the safety switch is OFF,
  # the condition above rejects the event and NOTHING restarts the timer. It then
  # sits in `idle` forever and the screensaver can never engage — observed live:
  # switch on, wait 10 minutes, screen never blanked, timer state "idle".
  # Turning the switch on must therefore (re)start the countdown itself.
  - alias: "Kitchen — start inactivity timer when the screensaver is enabled"
    trigger:
      - platform: state
        entity_id: input_boolean.kitchen_screensaver_enabled
        to: "on"
    action:
      - service: timer.start
        target:
          entity_id: timer.kitchen_inactivity
        data:
          # Clamped to the helper's own range; an unknown state falls back to 30.
          duration: >
            {% set m = states('input_number.kitchen_screensaver_minutes') | float(30) | int %}
            {% set m = [5, [m, 120] | min] | max %}
            {{ '%02d:%02d:00' % (m // 60, m % 60) }}

  - alias: "Kitchen — wake on activity ping (M-10 browser->HA bridge)"
    mode: restart
    # The kiosk fires input_button.kitchen_activity on touch (wired on hardware,
    # see deploy/INSTALL.md). That restarts the inactivity timer and clears idle.
    trigger:
      - platform: state
        entity_id: input_button.kitchen_activity
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.kitchen_idle
      - service: timer.start
        target:
          entity_id: timer.kitchen_inactivity
        data:
          # Night wake (spec §3): inside the sleep window a tap (or an HA restart)
          # lights the panel for 2 minutes, not the full delay. Otherwise clamped to
          # the helper's own range; an unknown state falls back to 30.
          duration: >
            {% if is_state('binary_sensor.kitchen_sleep_window', 'on') %}00:02:00{% else %}
            {%- set m = states('input_number.kitchen_screensaver_minutes') | float(30) | int %}
            {%- set m = [5, [m, 120] | min] | max %}
            {{- '%02d:%02d:00' % (m // 60, m % 60) }}{% endif %}

  - alias: "Kitchen — start inactivity timer on HA startup"
    trigger:
      - platform: homeassistant
        event: start
    action:
      # Always come up AWAKE. kitchen_idle is a restored entity, so after a
      # reboot it came back "on" and the panel booted straight into a black
      # screen — with no touch, nothing could clear it. Starting clean means a
      # reboot is always a way out, whatever state the screen was left in.
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.kitchen_idle
      - service: timer.start
        target:
          entity_id: timer.kitchen_inactivity
        data:
          # Night wake (spec §3): inside the sleep window a tap (or an HA restart)
          # lights the panel for 2 minutes, not the full delay. Otherwise clamped to
          # the helper's own range; an unknown state falls back to 30.
          duration: >
            {% if is_state('binary_sensor.kitchen_sleep_window', 'on') %}00:02:00{% else %}
            {%- set m = states('input_number.kitchen_screensaver_minutes') | float(30) | int %}
            {%- set m = [5, [m, 120] | min] | max %}
            {{- '%02d:%02d:00' % (m // 60, m % 60) }}{% endif %}

input_button:
  kitchen_activity:
    name: Kitchen Activity Ping

# ── Recovering a blanked screen without touch ────────────────────────────────
# Press input_button.kitchen_activity from ANY device (phone, laptop) to wake
# the panel — Settings -> Devices & Services -> Helpers -> "Kitchen Activity
# Ping" -> Press. It fires the same wake automation the touch handler would, so
# the screen is always recoverable even with no touch hardware attached.
#
# To put it on a dashboard as a one-tap button:
#   - type: button
#     name: Wake Screen
#     tap_action: { action: perform-action, perform_action: input_button.press,
#                   target: { entity_id: input_button.kitchen_activity } }
#
# OPTIONAL motion wake (M-11 — gated): uncomment and set your motion entity on hardware.
# automation manual add:
#   - alias: "Kitchen — wake on motion"
#     trigger: { platform: state, entity_id: binary_sensor.kitchen_motion, to: "on" }
#     action: [ { service: input_button.press, target: { entity_id: input_button.kitchen_activity } } ]
